name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref cancels the previous run: the verification jobs are
# cheap enough to redo, and the Windows bundle is the expensive one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Type-checks, Node regressions, and the browser harnesses. Runs on Linux for
  # speed; the browser harnesses are executed by scripts/run-browser-harnesses.cjs,
  # which starts a temporary dev server and drives headless Chrome.
  verify:
    name: Type-check & regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b covers all three projects: app (src/), node (vite.config.ts) and
      # scripts (the browser harnesses). The scripts project exists because the
      # harnesses used to be excluded from every tsconfig, so type drift in them
      # went unnoticed.
      - name: Type-check (app + node + scripts)
        run: npx tsc -b --force

      - name: Node regressions
        run: npm run test:node

      # Install a real Chrome. Ubuntu's `chromium` package is a snap stub on
      # 24.04 that headless mode cannot drive, so use Google's own .deb.
      - name: Install Chrome for harnesses
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb

      # HARNESS_ALLOW_SKIP is deliberately NOT set: with no browser the runner
      # must fail rather than report success (a silent skip is how the <use>
      # defect went unnoticed).
      - name: Browser harnesses
        env:
          BROWSER_PATH: /usr/bin/google-chrome-stable
        run: node scripts/run-browser-harnesses.cjs

      - name: Web build
        run: npm run build

  # Produces the NSIS installer. NSIS is a Windows-only toolchain, so this job
  # cannot run on ubuntu-latest.
  bundle:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Caches src-tauri/target; without it every run recompiles the whole Tauri
      # dependency tree.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # tauri build runs `npm run build` first (beforeBuildCommand), which is
      # `tsc -b && vite build`, so a type error fails the bundle too.
      - name: Build Tauri app and installer
        run: npm run app:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: layercut-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: layercut-windows-exe
          path: src-tauri/target/release/layercut.exe
          if-no-files-found: error
